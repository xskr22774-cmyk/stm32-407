name: Import STM32 source files
on:
  push:
    branches: [main]
    paths: ['.import/ready.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore and verify original source tree
        env:
          GH_IMPORT_TOKEN: ${{ github.token }}
          IMPORT_REPOSITORY: ${{ github.repository }}
          IMPORT_TRIGGER_SHA: ${{ github.sha }}
        shell: python
        run: |
          import os, subprocess, pathlib, json, hashlib, base64
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stm32-import'
          root.mkdir()
          env = os.environ.copy()
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_IMPORT_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth,
                     GIT_AUTHOR_NAME='xskr22774-cmyk', GIT_AUTHOR_EMAIL='341493352+xskr22774-cmyk@users.noreply.github.com',
                     GIT_COMMITTER_NAME='xskr22774-cmyk', GIT_COMMITTER_EMAIL='341493352+xskr22774-cmyk@users.noreply.github.com')
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, env=env).decode().strip()
          git('init')
          git('remote', 'add', 'origin', 'https://github.com/' + env['IMPORT_REPOSITORY'] + '.git')
          git('fetch', 'origin', 'main', 'codex-import-data')
          parent = git('rev-parse', 'refs/remotes/origin/main')
          assert parent == env['IMPORT_TRIGGER_SHA'], 'Main changed; refusing to overwrite.'
          manifest = json.loads(git('show', parent + ':.import/ready.json'))
          git('checkout', '--detach', 'refs/remotes/origin/codex-import-data')
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source.bundle'
          digest = hashlib.sha256()
          with bundle.open('wb') as out:
              for name in manifest['parts']:
                  data = (root / 'parts' / name).read_bytes()
                  digest.update(data)
                  out.write(data)
          assert digest.hexdigest() == manifest['sha256'], 'Bundle checksum mismatch.'
          git('bundle', 'verify', str(bundle))
          git('fetch', str(bundle), 'refs/heads/source:refs/remotes/import/source')
          tree = git('rev-parse', 'refs/remotes/import/source^{tree}')
          assert tree == manifest['sourceTree'], 'Source tree checksum mismatch.'
          count = len(subprocess.check_output(['git', 'ls-tree', '-rz', '--name-only', tree], cwd=root, env=env).split(b'\0')) - 1
          assert count == manifest['files'], 'File count mismatch.'
          commit = git('commit-tree', tree, '-p', parent, '-m', 'Import all 27,776 STM32 F407ZG HAL example files')
          git('push', 'origin', commit + ':refs/heads/main')
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == commit
          print('Import verified:', count, 'files; tree', tree, '; commit', commit)
          git('push', 'origin', '--delete', 'codex-import-data')
